# One-stack deployment of the ConnectWise Manage MCP with PII masking.
# Standalone file: do not combine it with docker-compose.yml.
#
#   cp stack.env.example .env      # then fill it in
#   docker compose -f docker-compose.stack.yml up -d --build
#
# Three containers on one private network:
#   signing-proxy          the only published port. Checks a bearer token, adds
#                          the X-Gateway-S2S header the MCP server requires.
#   connectwise-manage-mcp the MCP server (PII_MODE=on). No published port.
#   presidio-analyzer      name detection for free text. No published port, no
#                          authentication of its own.
#
# Claude connects to http://<host>:8081/mcp with
#   Authorization: Bearer <that person's token from PROXY_USERS>
name: cw-mcp-pii

services:
  signing-proxy:
    image: node:26-alpine
    container_name: cw-signing-proxy
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "/app/proxy.mjs"]
    volumes:
      - ./deploy/signing-proxy/proxy.mjs:/app/proxy.mjs:ro
    environment:
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # One entry per person: name:token[:role];name:token ... (see stack.env.example).
      # The proxy refuses to start with neither PROXY_USERS nor PROXY_BEARER_TOKEN.
      - PROXY_USERS=${PROXY_USERS:-}
      - PROXY_BEARER_TOKEN=${PROXY_BEARER_TOKEN:-}
      # tokens = per-person tokens above. entra = Microsoft Entra sign-in (also
      # set MCP_OAUTH_ENABLED=true and the AZURE_* values below).
      - PROXY_AUTH=${PROXY_AUTH:-tokens}
      - UPSTREAM_URL=http://connectwise-manage-mcp:8080
      - PORT=8081
    ports:
      # Loopback by default. Set PROXY_BIND=0.0.0.0 to reach it from another
      # machine. The port speaks plain HTTP, so use a trusted network, a VPN or
      # an SSH tunnel, not the open internet.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8081}:8081"
    depends_on:
      connectwise-manage-mcp:
        condition: service_healthy

  connectwise-manage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cw-manage-mcp-pii:local
    container_name: cw-manage-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=env
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - CW_MANAGE_COMPANY_ID=${CW_MANAGE_COMPANY_ID:?set CW_MANAGE_COMPANY_ID}
      - CW_MANAGE_PUBLIC_KEY=${CW_MANAGE_PUBLIC_KEY:?set CW_MANAGE_PUBLIC_KEY}
      - CW_MANAGE_PRIVATE_KEY=${CW_MANAGE_PRIVATE_KEY:?set CW_MANAGE_PRIVATE_KEY}
      - CW_MANAGE_CLIENT_ID=${CW_MANAGE_CLIENT_ID:?set CW_MANAGE_CLIENT_ID}
      - CW_MANAGE_URL=${CW_MANAGE_URL:-https://api-na.myconnectwise.net}
      - PII_MODE=on
      - PII_KEY=${PII_KEY:?set PII_KEY}
      - PII_PRESIDIO_URL=http://presidio-analyzer:3000
      - PII_PRESIDIO_TIMEOUT_MS=${PII_PRESIDIO_TIMEOUT_MS:-5000}
      # One JSON audit line per tool call (who, tool, ids, outcome) on stderr:
      # docker logs cw-manage-mcp
      - MCP_AUDIT=on
      # Default access for callers without a role. read = read tools only. A
      # per-user role in PROXY_USERS overrides it (read | write | admin).
      - MCP_POLICY=${MCP_POLICY:-read}
      # Microsoft Entra sign-in. Off unless MCP_OAUTH_ENABLED=true. See
      # entra-app-registration.md. MCP_SERVER_URL is the public https address
      # people connect to (no trailing slash). The server advertises it.
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-false}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_AUDIENCE=${AZURE_AUDIENCE:-}
      - AZURE_REQUIRED_ROLE=${AZURE_REQUIRED_ROLE:-CWM.Access}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    expose:
      - "8080"
    depends_on:
      presidio-analyzer:
        condition: service_healthy
    # Overrides the image's check, which uses `localhost`. In the container
    # that resolves to ::1 first, and the server listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # HTTPS in front of the proxy. Optional: start it with `--profile https`.
  # Caddy gets its certificate by the DNS challenge through Cloudflare (it
  # writes a TXT record with the API token), so no inbound port has to be open
  # for the certificate. People still need a network path to this machine: the
  # LAN or a VPN is enough for Claude Code. See README, "HTTPS and Entra sign-in".
  caddy:
    profiles: ["https"]
    build:
      context: ./deploy/caddy
    image: cw-mcp-caddy:local
    container_name: cw-caddy
    restart: unless-stopped
    environment:
      - MCP_HOSTNAME=${MCP_HOSTNAME:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    ports:
      # Loopback by default. Set HTTPS_BIND=0.0.0.0 for other machines.
      - "${HTTPS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - signing-proxy

  presidio-analyzer:
    # Tag 2.2.364 verified on ghcr.io 2026-10-22. First start can take a minute
    # (spaCy model load). Expect about 1 to 2 GiB of memory (unverified).
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: cw-presidio-analyzer
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  caddy-data:
  caddy-config:
