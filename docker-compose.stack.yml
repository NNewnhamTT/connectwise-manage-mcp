# One-stack deployment of the ConnectWise Manage MCP with PII masking.
# Standalone file: do not combine it with docker-compose.yml.
#
#   cp stack.env.example .env      # then fill it in
#   docker compose -f docker-compose.stack.yml up -d --build
#
# Three containers on one private network:
#   signing-proxy          the only published port. Checks a bearer token, adds
#                          the X-Gateway-S2S header the MCP server requires.
#   connectwise-manage-mcp the MCP server (PII_MODE=on). No published port.
#   presidio-analyzer      name detection for free text. No published port, no
#                          authentication of its own.
#
# Claude connects to http://<host>:8081/mcp with
#   Authorization: Bearer <that person's token from PROXY_USERS>
name: cw-mcp-pii

services:
  signing-proxy:
    image: node:26-alpine
    container_name: cw-signing-proxy
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "/app/proxy.mjs"]
    volumes:
      - ./deploy/signing-proxy/proxy.mjs:/app/proxy.mjs:ro
    environment:
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # One entry per person: name:token[:role];name:token ... (see stack.env.example).
      # The proxy refuses to start with neither PROXY_USERS nor PROXY_BEARER_TOKEN.
      - PROXY_USERS=${PROXY_USERS:-}
      - PROXY_BEARER_TOKEN=${PROXY_BEARER_TOKEN:-}
      # tokens = per-person tokens above. entra = Microsoft Entra sign-in (also
      # set MCP_OAUTH_ENABLED=true and the AZURE_* values below).
      - PROXY_AUTH=${PROXY_AUTH:-tokens}
      - UPSTREAM_URL=http://connectwise-manage-mcp:8080
      - PORT=8081
    ports:
      # Loopback by default. Set PROXY_BIND=0.0.0.0 to reach it from another
      # machine. The port speaks plain HTTP, so use a trusted network, a VPN or
      # an SSH tunnel, not the open internet.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8081}:8081"
    depends_on:
      connectwise-manage-mcp:
        condition: service_healthy

  connectwise-manage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cw-manage-mcp-pii:local
    container_name: cw-manage-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=env
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - CW_MANAGE_COMPANY_ID=${CW_MANAGE_COMPANY_ID:?set CW_MANAGE_COMPANY_ID}
      # The shared key is needed only when CW_CREDENTIALS=shared (the default). With
      # per-user keys leave both empty: the server never uses them in that mode.
      - CW_MANAGE_PUBLIC_KEY=${CW_MANAGE_PUBLIC_KEY:-}
      - CW_MANAGE_PRIVATE_KEY=${CW_MANAGE_PRIVATE_KEY:-}
      - CW_MANAGE_CLIENT_ID=${CW_MANAGE_CLIENT_ID:?set CW_MANAGE_CLIENT_ID}
      - CW_MANAGE_URL=${CW_MANAGE_URL:-https://api-na.myconnectwise.net}
      # shared = one API member for everybody. per-user = each person's own CW key
      # from CW_USER_KEYS (name=publicKey:privateKey;...). A person with no key is
      # refused. Anyone who can run `docker inspect` on this machine can read these
      # keys. See cw-per-user-keys.md.
      - CW_CREDENTIALS=${CW_CREDENTIALS:-shared}
      - CW_USER_KEYS=${CW_USER_KEYS:-}
      - PII_MODE=on
      - PII_KEY=${PII_KEY:?set PII_KEY}
      - PII_PRESIDIO_URL=http://presidio-analyzer:3000
      - PII_PRESIDIO_TIMEOUT_MS=${PII_PRESIDIO_TIMEOUT_MS:-5000}
      # One JSON audit line per tool call (who, tool, ids, outcome) on stderr:
      # docker logs cw-manage-mcp
      - MCP_AUDIT=on
      # Default access for callers without a role. read = read tools only. A
      # per-user role in PROXY_USERS overrides it (read | write | admin).
      - MCP_POLICY=${MCP_POLICY:-read}
      # Microsoft Entra sign-in. Off unless MCP_OAUTH_ENABLED=true. See
      # entra-app-registration.md. MCP_SERVER_URL is the public https address
      # people connect to (no trailing slash). The server advertises it.
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-false}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_AUDIENCE=${AZURE_AUDIENCE:-}
      - AZURE_REQUIRED_ROLE=${AZURE_REQUIRED_ROLE:-CWM.Access}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      # Optional write policy: a JSON file that lists the write tools allowed and
      # the argument values each may use (default-deny). Empty = off. The folder
      # ./deploy/write-policy is mounted read-only at /etc/cw-mcp, so a value is
      # /etc/cw-mcp/write-policy.json. See README, "Write policy".
      - MCP_WRITE_POLICY_FILE=${MCP_WRITE_POLICY_FILE:-}
    volumes:
      - ./deploy/write-policy:/etc/cw-mcp:ro
    expose:
      - "8080"
    depends_on:
      presidio-analyzer:
        condition: service_healthy
    # Overrides the image's check, which uses `localhost`. In the container
    # that resolves to ::1 first, and the server listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # HTTPS in front of the proxy. Optional: start it with `--profile https`.
  # Caddy gets its certificate by the DNS challenge through Cloudflare (it
  # writes a TXT record with the API token), so no inbound port has to be open
  # for the certificate. People still need a network path to this machine: the
  # LAN or a VPN is enough for Claude Code. See README, "HTTPS and Entra sign-in".
  caddy:
    profiles: ["https"]
    build:
      context: ./deploy/caddy
    image: cw-mcp-caddy:local
    container_name: cw-caddy
    restart: unless-stopped
    # Caddyfile = ConnectWise host only. Caddyfile.itglue = both hosts; use it
    # only with `--profile itglue` too (its proxy must exist).
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-Caddyfile}", "--adapter", "caddyfile"]
    environment:
      - MCP_HOSTNAME=${MCP_HOSTNAME:-}
      - ITGLUE_HOSTNAME=${ITGLUE_HOSTNAME:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    ports:
      # Loopback by default. Set HTTPS_BIND=0.0.0.0 for other machines.
      - "${HTTPS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/Caddyfile.itglue:/etc/caddy/Caddyfile.itglue:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - signing-proxy

  presidio-analyzer:
    # Tag 2.2.364 verified on ghcr.io 2026-10-22. First start can take a minute
    # (spaCy model load). Expect about 1 to 2 GiB of memory (unverified).
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: cw-presidio-analyzer
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # IT Glue MCP (optional): start with `--profile itglue`.
  # The server is the TekTrendz fork NNewnhamTT/itglue-mcp, branch
  # tektrendz-hardening, cloned next to this repo (ITGLUE_REPO_PATH, default
  # ../itglue-mcp). Same controls as the ConnectWise server: PII masking through
  # the shared Presidio container, audit log, access policy, Entra sign-in.
  # Password tools are removed in that fork. Its own proxy, its own S2S secret,
  # its own published port, and its own Entra app (roles ITGM.Access / ITGM.Write /
  # ITGM.Admin). With `--profile https` also set CADDY_CONFIG=Caddyfile.itglue.
  # ---------------------------------------------------------------------------
  itglue-signing-proxy:
    profiles: ["itglue"]
    image: node:26-alpine
    container_name: itglue-signing-proxy
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "/app/proxy.mjs"]
    volumes:
      - ./deploy/signing-proxy/proxy.mjs:/app/proxy.mjs:ro
    environment:
      # Separate from CONDUIT_S2S_SECRET, so one proxy cannot sign for the other server.
      - CONDUIT_S2S_SECRET=${ITGLUE_S2S_SECRET:-}
      - PROXY_USERS=${ITGLUE_PROXY_USERS:-}
      - PROXY_BEARER_TOKEN=
      - PROXY_AUTH=${ITGLUE_PROXY_AUTH:-tokens}
      - UPSTREAM_URL=http://itglue-mcp:8080
      - PORT=8081
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${ITGLUE_PROXY_PORT:-8082}:8081"
    depends_on:
      itglue-mcp:
        condition: service_healthy

  itglue-mcp:
    profiles: ["itglue"]
    build:
      context: ${ITGLUE_REPO_PATH:-../itglue-mcp}
      dockerfile: Dockerfile
      # Upstream's own docker-compose.yml names a "production" stage that its
      # Dockerfile does not have. The final stage is "runner".
      target: runner
    image: itglue-mcp-pii:local
    container_name: itglue-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=env
      # The server refuses to start with an empty or placeholder secret.
      - CONDUIT_S2S_SECRET=${ITGLUE_S2S_SECRET:-}
      # One shared IT Glue API key (IT Glue has no per-person API keys we use).
      # Anyone who can run `docker inspect` on this machine can read it.
      - ITGLUE_API_KEY=${ITGLUE_API_KEY:-}
      - ITGLUE_REGION=${ITGLUE_REGION:-us}
      - PII_MODE=on
      - PII_KEY=${PII_KEY:?set PII_KEY}
      - PII_PRESIDIO_URL=http://presidio-analyzer:3000
      - PII_PRESIDIO_TIMEOUT_MS=${PII_PRESIDIO_TIMEOUT_MS:-5000}
      - MCP_AUDIT=on
      - MCP_POLICY=${ITGLUE_MCP_POLICY:-read}
      - MCP_OAUTH_ENABLED=${ITGLUE_MCP_OAUTH_ENABLED:-false}
      - MCP_SERVER_URL=${ITGLUE_MCP_SERVER_URL:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${ITGLUE_AZURE_CLIENT_ID:-}
      - AZURE_AUDIENCE=${ITGLUE_AZURE_AUDIENCE:-}
      - AZURE_REQUIRED_ROLE=${ITGLUE_AZURE_REQUIRED_ROLE:-ITGM.Access}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    expose:
      - "8080"
    depends_on:
      presidio-analyzer:
        condition: service_healthy
    # Same reason as the ConnectWise server: `localhost` resolves to ::1 first.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
